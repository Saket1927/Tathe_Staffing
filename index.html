    <meta name="description" content="TATHE Staffing delivers AI-driven workforce solutions, skilling, apprenticeship programs (NAPS, NATS, WILP), and professional staffing across India and globally." />

        try {
          var params = new URLSearchParams(window.location.search);

        } catch (e) {}
      })();
